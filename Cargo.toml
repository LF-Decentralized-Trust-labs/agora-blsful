[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = [
    "cryptography",
    "authentication",
    "no-std",
    "algorithms",
]
description = """BLS signature implementation according to the IETF spec on the BLS12-381 curve."""
documentation = "https://docs.rs/blsful"
edition = "2024"
homepage = "https://github.com/LF-Decentralized-Trust-labs/agora-blsful"
keywords = ["crypto", "signature", "signing", "bls"]
license = "MIT OR Apache-2.0"
name = "blsful"
readme = "README.md"
repository = "https://github.com/LF-Decentralized-Trust-labs/agora-blsful"
version = "4.0.0"

[features]
default = ["blst"]
rust = ["bls12_381_plus/expose-fields"]
blst = ["blstrs_plus", "blstrs_plus/expose-fields"]

[dependencies]
bls12_381_plus = { version = "0.9.0", optional = true, default-features = false, features = ["bits", "pairings"] }
blstrs_plus = { version = "0.9.0", optional = true, default-features = false, features = ["bits", "pairings"] }
hkdf = { version = "0.13", default-features = false }
merlin = { version = "3", default-features = false }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_bare = "0.5"
sha2 = { version = "0.11", default-features = false }
sha2_010 = { package = "sha2", version = "0.10", default-features = false }
shake = { version = "0.1", default-features = false }
subtle = { version = "2.6", default-features = false }
thiserror = "2.0"
unsigned-varint = "0.8"
vsss-rs = { version = "6.0.1", default-features = false, features = ["alloc", "curve", "serde", "zeroize"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
ciborium = "0.2"
hex = "0.4"
noyalib = { version = "0.0.18", default-features = false, features = ["minimal"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand_xorshift = "0.5"
rstest = { version = "0.26", default-features = false }
serde_json = "1.0"
toml = "1.1"
